[build-system]
# PEP 639 `license`/`license-files` below need hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The DISTRIBUTION name, hyphenated to match what PyPI displays and what
# `pip install pathlib-next` takes. PEP 503 normalises `_` to `-`, so this
# was already published as `pathlib-next`; spelling it that way here just
# stops the repo, the docs and the index from disagreeing.
#
# The IMPORT name stays `pathlib_next` (`packages` below, and every
# `import pathlib_next`) -- a hyphen is not legal in a Python identifier.
# Distribution name and import name differing is ordinary and intended.
name = "pathlib-next"
version = "0.9.3"
authors = [{ name = "Jose A" }]
description = "Generic Path Protocol based pathlib"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: SPDX license expression plus the file it refers to. This replaces
# the legacy `License ::` classifier; do not list one alongside it.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    # src/pathlib_next/py.typed ships in the wheel.
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
uripath = "pathlib_next.tools.uripath:main"

[project.optional-dependencies]
uri = ["uritools", "netimps>=0.2.0"]
http = ["requests", "pathlib_next[uri]"]
sftp = ["paramiko", "pathlib_next[uri]"]
sftp-async = ["asyncssh<2.22; python_version<'3.10'", "asyncssh; python_version>='3.10'", "pathlib_next[uri]"]
s3 = ["boto3", "pathlib_next[uri]"]
gs = ["google-cloud-storage", "pathlib_next[uri]"]
az = ["azure-storage-blob", "pathlib_next[uri]"]
dev = ['build', 'twine', 'hatchling', 'pytest', 'pytest-cov', 'pyftpdlib', 'wsgidav', 'cheroot', 'moto[s3]', 'hypothesis', 'black']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

[project.entry-points."pathlib_next.schemes"]
file = "pathlib_next.uri.schemes.file:FileUri"
data = "pathlib_next.uri.schemes.data:DataUri"
zip = "pathlib_next.uri.schemes.archive:ZipUri"
tar = "pathlib_next.uri.schemes.archive:TarUri"
archive = "pathlib_next.uri.schemes.archive:ArchiveUri"
"archive+zip" = "pathlib_next.uri.schemes.archive:ArchiveZipUri"
"archive+tar" = "pathlib_next.uri.schemes.archive:ArchiveTarUri"
ftp = "pathlib_next.uri.schemes.ftp:FtpPath"
ftps = "pathlib_next.uri.schemes.ftp:FtpPath"
http = "pathlib_next.uri.schemes.http:HttpPath"
https = "pathlib_next.uri.schemes.http:HttpPath"
dav = "pathlib_next.uri.schemes.dav:DavPath"
davs = "pathlib_next.uri.schemes.dav:DavPath"
sftp = "pathlib_next.uri.schemes.sftp:SftpPath"
s3 = "pathlib_next.uri.schemes.s3:S3Path"
gs = "pathlib_next.uri.schemes.gs:GsPath"
az = "pathlib_next.uri.schemes.az:AzPath"
github = "pathlib_next.uri.schemes.github:GitHubPath"
gitlab = "pathlib_next.uri.schemes.gitlab:GitLabPath"
git = "pathlib_next.uri.schemes.git:GitPath"
"git+github" = "pathlib_next.uri.schemes.git:GitHubGitPath"
"git+gitlab" = "pathlib_next.uri.schemes.git:GitLabGitPath"

[project.urls]
Homepage = "https://github.com/jose-pr/pathlib-next/"
Documentation = "https://jose-pr.github.io/pathlib-next/"
Issues = "https://github.com/jose-pr/pathlib-next/issues"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/pathlib_next/AGENTS.md (the API header) is included automatically by
# living in the package dir. The repo-root AGENTS.md is contributor
# orientation for a checkout and is not part of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pathlib_next/README.md"

# `*.local.*` files are per-machine overrides: never packaged (and gitignored).
# `/.*` does not match them, since their names do not start with a dot.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/benchmarks", "*.local.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pathlib_next"]
exclude = ["*.local.*"]


[tool.black]
# Pinned to the project's *minimum* supported Python so black never emits
# syntax the 3.9 floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # boto3 emits a Python 3.9 EOL notice warning; filter by module/message
    # so pytest doesn't need boto3 importable just to parse the warning rule.
    "ignore:.*Python 3\\.9.*:Warning:boto3(\\..*)?$",
    # ResourceWarnings from daemon-thread server sockets cleaned up by GC at
    # session teardown are expected; suppress to keep output readable.
    "ignore::ResourceWarning",
]
