name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Not triggered by push/PR on branches by default -- add that only if the
# project actually wants CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      benchmark:
        description: "Also run the benchmark suite (manual runs only)"
        type: boolean
        required: false
        default: false
      benchmark_recursive:
        description: "Run the recursive SFTP benchmark cases"
        required: false
        default: "false"
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # Install every extra that has tests depending on it, or those tests
        # silently skip (pytest.importorskip) instead of actually running.
        # gs/az (google-cloud-storage, azure-storage-blob) are heavy SDKs and
        # run in their own job below.
        run: python -m pip install -e ".[dev,uri,http,sftp,sftp-async,s3]"
      - name: Run tests
        # -rs lists every skip with its reason, so a missing extra shows up.
        run: python -m pytest -q -rs

  test-cloud-sdks:
    name: Test with gs/az SDKs (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with every extra, gs and az included
        run: python -m pip install -e ".[dev,uri,http,sftp,sftp-async,s3,gs,az]"
      - name: Run tests
        # The GCS/Azure contract suites run against in-process fake servers
        # (tests/conftest.py); no credentials are needed.
        run: python -m pytest -q -rs

  test-no-extras:
    name: Test No-Extras (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without extras
        # Exactly `pip install pathlib-next` plus the test runner: no uritools,
        # no netimps, nothing from `dev`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run the test suite without extras
        # tests/conftest.py leaves out modules that import the `uri` extra at
        # module level; everything else must collect and pass or skip cleanly.
        run: python -m pytest -q -rs
      - name: uripath CLI reads a local file without extras
        run: |
          printf 'no extras\n' > local.txt
          test "$(uripath read local.txt)" = "no extras"

  benchmark:
    name: Benchmarks (py3.14, ${{ matrix.os }})
    # Opt-in: benchmarks are noisy and slow, so they never run on ci-* tags
    # or by default; dispatch the workflow with benchmark=true.
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev,uri,http,sftp,sftp-async]"
      - name: Run benchmark suite
        env:
          PATHLIB_NEXT_BENCH_SFTP_RECURSIVE: ${{ inputs.benchmark_recursive == 'true' && '1' || '0' }}
        shell: pwsh
        run: |
          python benchmarks/bench.py --save --name "ci-${{ matrix.os }}-py3.14" | Tee-Object -FilePath benchmark.txt
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.txt
            benchmarks/results/*.json
