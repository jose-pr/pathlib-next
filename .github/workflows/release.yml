name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
#
# Order: test gate -> build -> publish to PyPI -> GitHub release. The docs
# site is only GATED here (docs-gate, a strict build that never deploys and
# is not on the publish chain); docs.yml owns every Pages deploy.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # Every extra that has tests, or those tests silently skip. gs/az run
        # in test-cloud-sdks below.
        run: python -m pip install -e ".[dev,uri,http,sftp,sftp-async,s3]"
      - name: Run tests
        run: python -m pytest -q -rs

  test-cloud-sdks:
    name: Test with gs/az SDKs (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with every extra, gs and az included
        run: python -m pip install -e ".[dev,uri,http,sftp,sftp-async,s3,gs,az]"
      - name: Run tests
        run: python -m pytest -q -rs

  test-no-extras:
    name: Test No-Extras (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run the test suite without extras
        run: python -m pytest -q -rs
      - name: uripath CLI reads a local file without extras
        run: |
          printf 'no extras\n' > local.txt
          test "$(uripath read local.txt)" = "no extras"

  build:
    name: Build distribution
    needs: [test, test-cloud-sdks, test-no-extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Docs are DEPLOYED by docs.yml. This job only GATES on a strict docs build:
  # a broken docs site fails the release run, but nothing on the
  # build -> publish -> release chain needs it, so a docs-only problem can
  # never block a package that already passed its tests.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs,uri,http,sftp,sftp-async,s3]"
      - name: Build docs (gate only)
        run: mkdocs build --strict

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pathlib-next/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially-completed release re-run must not hard-fail on files
          # already uploaded (PyPI never lets a version be replaced); skip them
          # and publish only what's missing.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        run: |
          import pathlib
          import re
          import sys

          tag = "${{ github.ref_name }}"
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Pin the release object to the tagged commit. Left unset it
          # defaults to the default branch, which breaks note generation
          # ("Invalid target_commitish") once that branch is renamed.
          target_commitish: ${{ github.sha }}
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # A release created with GITHUB_TOKEN does not fire `release: published`
  # (GitHub suppresses workflow runs for events that token causes, except
  # workflow_dispatch/repository_dispatch), so docs.yml would never deploy
  # this version on its own. Dispatch it explicitly for the tag, once both
  # the release and the strict docs build have succeeded. The deploy itself
  # still happens only in docs.yml.
  docs-dispatch:
    name: Trigger docs deploy for this tag
    needs: [github-release, docs-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
